name: nexus_mobile
description: Nexus for Android. Finds nearby Nexus devices, pairs with them and shows their status.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  path_provider: ^2.1.3
  battery_plus: ^6.0.3
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

# Newer flutter_plugin_android_lifecycle releases (2.0.24+) force every Android
# module to compile against SDK 36, which the stable CI toolchain doesn't ship
# yet. file_picker and battery_plus pull it in transitively; pin it to a
# 34-compatible release so the release APK builds cleanly.
dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.17

flutter:
  uses-material-design: true
