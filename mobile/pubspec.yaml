name: nexus_mobile
description: Nexus for Android. Finds nearby Nexus devices, pairs with them and shows their status.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  path_provider: ^2.1.3
  battery_plus: ^6.0.3
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

# flutter_plugin_android_lifecycle 2.0.28+ compiles against flutter.compileSdkVersion
# (36 on current toolchains), which makes every dependent module demand SDK 36 and
# breaks the release APK on the stable CI toolchain. file_picker and battery_plus
# pull it in transitively. Pin it to 2.0.24: v2-embedding only (so it builds on
# modern Flutter) and still on compileSdk 35 (so nothing forces SDK 36).
dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.24

flutter:
  uses-material-design: true
