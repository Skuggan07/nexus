name: nexus_mobile
description: Nexus for Android. Finds nearby Nexus devices, pairs with them and shows their status.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  path_provider: ^2.1.3
  battery_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
