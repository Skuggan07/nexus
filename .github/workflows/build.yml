# Builds Nexus for Windows and Android on every push to main,
# then publishes both files on the repository's Releases page.
name: Build Nexus

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows app
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Test
        shell: pwsh
        run: |
          # A couple of tests use real loopback sockets, which can briefly race
          # on CI (Windows error 10057). The logic is deterministic, so retry
          # the suite a few times before calling it a failure.
          $ok = $false
          for ($i = 1; $i -le 3; $i++) {
            cargo test
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "cargo test attempt $i failed (exit $LASTEXITCODE); retrying..."
            Start-Sleep -Seconds 2
          }
          if (-not $ok) { exit 1 }
      - name: Build
        run: cargo build --release
      - name: Collect
        run: Copy-Item target/release/nexus.exe ../nexus-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-windows
          path: nexus-windows.exe

  android:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: |
          flutter create --platforms=android --org app.nexus --project-name nexus_mobile .
          rm -f test/widget_test.dart
          python3 ../.github/patch_manifest.py android/app/src/main/AndroidManifest.xml
          # Native Android parts: screen sharing service and the remote-control Accessibility service.
          cp -r native/android/. android/app/src/main/
          # file_picker's transitive deps require compiling against Android API 36.
          # Also pin the NDK to one already installed on the runner so Gradle does
          # not try to download it mid-build (that download sometimes corrupts).
          NDK_VER=""
          for d in "$ANDROID_SDK_ROOT/ndk" "$ANDROID_HOME/ndk" /usr/local/lib/android/sdk/ndk; do
            if [ -d "$d" ]; then NDK_VER=$(ls -1 "$d" | sort -V | tail -1); [ -n "$NDK_VER" ] && break; fi
          done
          echo "Pinning NDK to: ${NDK_VER:-<none found, leaving default>}"
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f "$f" ]; then
              sed -i -E 's/compileSdk(Version)?[ =]+flutter\.compileSdkVersion/compileSdk = 36/' "$f"
              sed -i -E 's/targetSdk(Version)?[ =]+flutter\.targetSdkVersion/targetSdk = 36/' "$f"
              # Gestures for remote control need Android 7.0 (API 24) or newer.
              sed -i -E 's/minSdk(Version)?[ =]+flutter\.minSdkVersion/minSdk = 24/' "$f"
              if [ -n "$NDK_VER" ]; then
                sed -i -E "s/ndkVersion[ =]+flutter\.ndkVersion/ndkVersion = \"$NDK_VER\"/" "$f"
              fi
            fi
          done
      - run: flutter pub get
      - name: Test (shared protocol vectors)
        run: flutter test
      - name: Build APK
        run: flutter build apk --release
      - name: Collect
        run: cp build/app/outputs/flutter-apk/app-release.apk ../nexus-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-android
          path: nexus-android.apk

  release:
    name: Publish download page
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Nexus build ${{ github.run_number }}
          make_latest: true
          body: |
            **Android:** download `nexus-android.apk` on your phone and open it.
            **Windows:** download `nexus-windows.exe` and run it.
          files: |
            out/nexus-windows.exe
            out/nexus-android.apk
