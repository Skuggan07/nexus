[package]
name = "nexus"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Nexus desktop: discover nearby devices, pair them securely and show their connection status"
license = "MIT"

[dependencies]
eframe = "0.29"                                              # native window + egui UI
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }  # long-term device keys
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
socket2 = "0.5"                                              # UDP broadcast socket options
if-addrs = "0.13"                                            # per-interface broadcast addresses
directories = "5"                                            # %APPDATA% location
sysinfo = { version = "0.30", default-features = false }   # CPU and RAM usage
mac_address = "1"                                           # local MAC addresses for Wake-on-LAN
image = { version = "0.25", default-features = false, features = ["jpeg"] }  # encode/decode screen frames
base64 = "0.22"                                            # frames travel as base64 inside a JSON line
ureq = "2"                                                 # in-app updates (asks GitHub for the newest release)

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Power",        # battery level + keep-awake
    "Win32_Foundation",
    "Win32_Graphics_Gdi",        # screen capture (BitBlt / GetDIBits)
    "Win32_UI_WindowsAndMessaging",  # GetSystemMetrics
    "Win32_UI_Input_KeyboardAndMouse",  # remote control (SendInput) + idle time
    "Win32_System_SystemInformation",   # automation: local time and tick count
    "Win32_UI_Shell",                   # automation: open programs, files and web addresses
    "Win32_System_DataExchange",        # shared clipboard
    "Win32_System_Memory",              # shared clipboard (clipboard memory)
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
